name: Alístate (SNGR)

# Lo dispara cron-job.org por la API de GitHub (07:00 y 15:00, hora de Ecuador).
# También se puede correr a mano desde la pestaña Actions.
on:
  workflow_dispatch:

permissions:
  contents: write

# Una sola corrida a la vez entre INAMHI y Alístate: los dos escriben la ficha
concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  alistate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas==2.3.0 geopandas==1.1.0 requests==2.32.3 pyogrio==0.11.0 shapely==2.1.1

      - name: Descargar y procesar
        run: python alistate/scripts/alistate.py

      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alistate/data/raw alistate/data/out
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "alistate: corrida $(TZ=America/Guayaquil date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push

      - name: Armar la ficha
        run: python ficha/scripts/ficha.py

      - name: Guardar la ficha
        run: |
          git add ficha/data/out
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "ficha: tras alistate $(TZ=America/Guayaquil date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
